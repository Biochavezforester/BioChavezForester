name: Keep Streamlit Apps Warm

on:
  schedule:
    # Runs every 24 hours at 00:00 UTC (6:00 PM CST) to keep the apps awake
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  ping_apps:
    name: Ping Streamlit Applications
    runs-on: ubuntu-latest
    steps:
      - name: Ping FORXIME 2.0
        run: |
          echo "Pinging FORXIME..."
          curl -s -I "https://forxime2-0.streamlit.app/" | head -n 1
      
      - name: Ping ECOMETRICS
        run: |
          echo "Pinging ECOMETRICS..."
          curl -s -I "https://bioecometrics.streamlit.app/" | head -n 1
